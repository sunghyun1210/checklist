<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main toolbar -->
  <header id="topbar">
    <nav id="main-tabs">
      <button type="button" data-view="checklist">Checklist</button>
      <button type="button" data-view="calendar">Calendar</button>
    </nav>
    <button type="button" id="new-task">+ New task</button>
  </header>

  <div id="layout">
    <!-- Left: Inbox and categories (filled by script.js) -->
    <aside id="sidebar">
      <button type="button" class="side-item" data-filter="inbox">
        <span>Inbox</span><span id="inbox-count" class="side-count"></span>
      </button>
      <h2 class="side-heading">Categories</h2>
      <div id="category-list"></div>
      <button type="button" class="side-item" id="open-settings">Settings</button>
    </aside>

    <main id="content">
      <section id="checklist-view">
        <!-- Sub toolbar: All shows finished items too, To do hides them -->
        <nav id="sub-tabs">
          <button type="button" data-sub="all">All</button>
          <button type="button" data-sub="todo">To do</button>
        </nav>

        <h2 id="view-title"></h2>
        <div id="groups"></div>

        <div id="footer" hidden>
          <span id="count"></span>
          <button type="button" id="clear-done">Clear completed</button>
        </div>
      </section>

      <section id="calendar-view" hidden>
        <div id="cal-nav">
          <button type="button" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
          <h2 id="cal-title"></h2>
          <button type="button" id="cal-next" aria-label="Next month">&rsaquo;</button>
          <button type="button" id="cal-today">Today</button>
        </div>
        <div id="cal-grid"></div>
      </section>
    </main>

    <!-- Right: small summary cards (numbers are filled by script.js) -->
    <aside id="summary">
      <div class="card"><span class="card-label">Due today</span><span id="sum-today" class="card-num"></span></div>
      <div class="card"><span class="card-label">This week</span><span id="sum-week" class="card-num"></span></div>
      <div class="card"><span class="card-label">Done today</span><span id="sum-done" class="card-num"></span></div>
    </aside>
  </div>

  <!-- New task popup -->
  <dialog id="task-dialog">
    <form id="add-form">
      <input id="new-item" type="text" placeholder='Add a new item (e.g. @Category "task" t30)' autocomplete="off">
      <div class="chips">
        <input id="chip-date" type="date" aria-label="Due date">
        <select id="chip-category" aria-label="Category"></select>
        <select id="chip-minutes" aria-label="Estimate">
          <option value="0">Estimate</option>
          <option value="5">5m</option>
          <option value="10">10m</option>
          <option value="15">15m</option>
          <option value="25">25m</option>
          <option value="30">30m</option>
          <option value="45">45m</option>
          <option value="60">1h</option>
          <option value="90">1h 30m</option>
          <option value="120">2h</option>
        </select>
        <button type="submit">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Settings popup -->
  <dialog id="settings-dialog">
    <div class="dialog-body">
      <h2>Settings</h2>
      <p class="hint">Your tasks are saved only in this browser. Export a backup once in a while.</p>
      <button type="button" id="export">Export backup</button>
      <button type="button" id="import">Import backup</button>
      <input type="file" id="import-file" accept="application/json" hidden>
      <button type="button" id="clear-all" class="danger">Clear all data</button>
      <button type="button" id="close-settings">Close</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
