<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Checklist</h1>

    <form id="add-form">

    <ul id="list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
