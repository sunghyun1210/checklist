<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main toolbar: date | main tabs | new task -->
  <header id="topbar">
    <div id="today-date"></div>
    <nav id="main-tabs" class="seg">
      <button type="button" data-view="checklist">Checklist</button>
      <button type="button" data-view="calendar">Calendar</button>
    </nav>
    <button type="button" id="new-task">+ New task <kbd>&#8679;A</kbd></button>
  </header>

  <div id="layout">
    <!-- Left: Inbox (everything), categories, settings -->
    <aside id="sidebar">
      <label id="search">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="search-box" placeholder="Search" aria-label="Search tasks" autocomplete="off">
        <kbd>/</kbd>
        <button type="button" id="search-clear" aria-label="Clear search">&times;</button>
      </label>

      <!-- Group 1: Inbox (everything) and the smart lists. Click the title to fold / unfold. -->
      <section class="side-group" id="group-inbox">
        <button type="button" class="side-heading" data-toggle="group-inbox" aria-expanded="true">
          <span>Inbox</span>
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="side-body">
        <button type="button" class="side-item" id="inbox" data-filter="">
          <span class="dot"></span><span>All tasks</span><span id="inbox-count" class="side-count"></span>
        </button>
        <button type="button" class="side-item" data-filter="smart:today">
          <svg class="ic" style="color:#d99a2b" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/><path d="M12 2v7M4.22 10.22l1.42 1.42M1 18h2M21 18h2M18.36 11.64l1.42-1.42M23 22H1M8 6l4-4 4 4"/></svg>
          <span>Today</span><span class="side-count" data-smart="today"></span>
        </button>
        <button type="button" class="side-item" data-filter="smart:next">
          <svg class="ic" style="color:#5f8f87" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Next 7 days</span><span class="side-count" data-smart="next"></span>
        </button>
        <button type="button" class="side-item" data-filter="smart:overdue">
          <svg class="ic" style="color:#d0685a" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5M12 16h.01"/></svg>
          <span>Overdue</span><span class="side-count" data-smart="overdue"></span>
        </button>
        <button type="button" class="side-item" data-filter="smart:completed">
          <svg class="ic" style="color:#8a9096" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
          <span>Completed</span><span class="side-count" data-smart="completed"></span>
        </button>
        </div>
      </section>

      <!-- Group 2: categories (same look, also foldable) -->
      <section class="side-group" id="group-categories">
        <button type="button" class="side-heading" data-toggle="group-categories" aria-expanded="true">
          <span>Categories</span>
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="side-body">
          <div id="category-list"></div>
          <button type="button" class="side-item add" id="add-category">+ Add category</button>
          <input type="text" id="new-category" placeholder="Category name" maxlength="30" autocomplete="off" hidden>
        </div>
      </section>

      <!-- Small month: click a day to jump there (hidden when the window is short) -->
      <div id="minical">
        <div id="mini-head">
          <b id="mini-title"></b>
          <span>
            <button type="button" id="mini-prev" aria-label="Previous month">&lsaquo;</button>
            <button type="button" id="mini-next" aria-label="Next month">&rsaquo;</button>
          </span>
        </div>
        <div id="mini-grid"></div>
      </div>

      <!-- Bottom left: settings, with the undo / redo buttons next to it -->
      <div id="sidebar-bottom">
        <button type="button" class="side-item" id="open-settings">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
        <button type="button" class="round" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button type="button" class="round" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
      </div>
    </aside>

    <main id="content">
      <!-- Sub toolbar: tabs on the left, numbers on the right -->
      <div id="head">
        <nav id="sub-tabs" class="seg small"></nav>
        <div id="stats">
          <span class="vrule"></span>
          <div class="stat"><small>Due today</small><b id="sum-today"></b></div>
          <div class="stat"><small>This week</small><b id="sum-week"></b></div>
          <div class="stat"><small>Late</small><b id="sum-late"></b></div>
          <div class="stat"><small>Done</small><b id="sum-done"></b></div>
        </div>
      </div>

      <section id="checklist-view">
        <h2 id="view-title"></h2>
        <div id="groups"></div>

        <div id="footer" hidden>
          <span id="count"></span>
          <button type="button" id="clear-done">Clear completed</button>
        </div>
      </section>

      <section id="calendar-view" hidden>
        <div id="cal-nav">
          <button type="button" class="round" id="cal-prev" aria-label="Previous">&lsaquo;</button>
          <h2 id="cal-title"></h2>
          <button type="button" class="round" id="cal-next" aria-label="Next">&rsaquo;</button>
          <button type="button" id="cal-today">Today</button>
        </div>
        <div id="cal-month" class="month"></div>
        <div id="cal-week" class="week" hidden></div>
      </section>
    </main>
  </div>

  <!-- New task popup -->
  <dialog id="task-dialog">
    <form id="add-form">
      <input id="new-item" type="text" placeholder='Add a new item (e.g. @Category "task" t30)' autocomplete="off">
      <!-- Shows what was recognized in the text while typing -->
      <div id="preview"></div>
      <div class="chips">
        <input id="chip-date" type="date" aria-label="Due date">
        <select id="chip-category" aria-label="Category"></select>
        <select id="chip-minutes" aria-label="Estimate">
          <option value="0">Estimate</option>
          <option value="5">5m</option>
          <option value="10">10m</option>
          <option value="15">15m</option>
          <option value="25">25m</option>
          <option value="30">30m</option>
          <option value="45">45m</option>
          <option value="60">1h</option>
          <option value="90">1h 30m</option>
          <option value="120">2h</option>
        </select>
        <button type="submit">Add</button>
      </div>
      <p class="hint">
        <b>@category</b> &middot; <b>t25</b> = 25 min &middot; <b>d10/25</b> &middot; <b>d+3</b> (3 days later)
        &middot; <b>dtom</b> &middot; <b>dmon</b> &middot; Enter adds, Esc closes
      </p>
    </form>
  </dialog>

  <!-- Settings popup -->
  <dialog id="settings-dialog">
    <div class="dialog-body">
      <h2>Settings</h2>
      <p class="hint">Your tasks are saved only in this browser. Export a backup once in a while.</p>
      <button type="button" id="export">Export backup</button>
      <button type="button" id="import">Import backup</button>
      <input type="file" id="import-file" accept="application/json" hidden>
      <button type="button" id="clear-all" class="danger">Clear all data</button>
      <button type="button" id="close-settings">Close</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
